<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;padding:0}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Arial, sans-serif">
  <rect width="900" height="400" fill="white"/>
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Figure 11 — Diagramme de déploiement</text>
  <!-- Client node -->
  <rect x="50" y="60" width="280" height="200" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <text x="190" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Poste Client</text>
  <rect x="80" y="100" width="220" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="130" text-anchor="middle" font-size="12" fill="#1e40af">Navigateur Web</text>
  <rect x="80" y="165" width="220" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="190" y="195" text-anchor="middle" font-size="12" fill="#15803d">React SPA</text>
  <rect x="80" y="230" width="220" height="20" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="190" y="244" text-anchor="middle" font-size="10" fill="#92400e">localStorage</text>
  <!-- Server node -->
  <rect x="570" y="60" width="280" height="200" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <text x="710" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Serveur Statique</text>
  <rect x="600" y="100" width="220" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="710" y="130" text-anchor="middle" font-size="12" fill="#5b21b6">Nginx / Vercel</text>
  <rect x="600" y="165" width="220" height="50" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="710" y="195" text-anchor="middle" font-size="12" fill="#9a3412">dist/ (HTML/CSS/JS)</text>
  <!-- Connection -->
  <line x1="330" y1="160" x2="570" y2="160" stroke="#475569" stroke-width="2"/>
  <text x="450" y="155" text-anchor="middle" font-size="11" fill="#475569">HTTPS</text>
  <text x="450" y="175" text-anchor="middle" font-size="10" fill="#94a3b8">GET / POST</text>
  <!-- CI/CD -->
  <rect x="280" y="290" width="340" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">GitHub Actions (CI/CD)</text>
  <text x="450" y="335" text-anchor="middle" font-size="11" fill="#64748b">Build → Test → Deploy</text>
  <line x1="450" y1="260" x2="450" y2="290" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
</body></html>
