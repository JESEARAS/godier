<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;padding:0}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Arial, sans-serif">
  <rect width="900" height="500" fill="white"/>
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Figure 6 — Diagramme de séquence : Prise de rendez-vous</text>
  <!-- Actors lifelines -->
  <rect x="80" y="50" width="120" height="35" rx="4" fill="#2563eb"/>
  <text x="140" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Réceptionniste</text>
  <line x1="140" y1="85" x2="140" y2="480" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="340" y="50" width="120" height="35" rx="4" fill="#16a34a"/>
  <text x="400" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Interface</text>
  <line x1="400" y1="85" x2="400" y2="480" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="600" y="50" width="120" height="35" rx="4" fill="#d97706"/>
  <text x="660" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Store (Data)</text>
  <line x1="660" y1="85" x2="660" y2="480" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Messages -->
  <line x1="140" y1="120" x2="400" y2="120" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="115" text-anchor="middle" font-size="11" fill="#1e40af">1. Ouvrir formulaire RDV</text>
  <line x1="400" y1="155" x2="660" y2="155" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="530" y="150" text-anchor="middle" font-size="11" fill="#15803d">2. Charger patients &amp; médecins</text>
  <line x1="660" y1="185" x2="400" y2="185" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="530" y="180" text-anchor="middle" font-size="11" fill="#92400e">3. Retourner les listes</text>
  <line x1="140" y1="220" x2="400" y2="220" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="215" text-anchor="middle" font-size="11" fill="#1e40af">4. Sélectionner patient + médecin</text>
  <line x1="140" y1="255" x2="400" y2="255" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#1e40af">5. Saisir date &amp; heure</text>
  <line x1="140" y1="290" x2="400" y2="290" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="285" text-anchor="middle" font-size="11" fill="#1e40af">6. Valider le formulaire</text>
  <line x1="400" y1="320" x2="660" y2="320" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="530" y="315" text-anchor="middle" font-size="11" fill="#15803d">7. add(appointment)</text>
  <line x1="660" y1="350" x2="400" y2="350" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="530" y="345" text-anchor="middle" font-size="11" fill="#92400e">8. ID auto-incrémenté</text>
  <line x1="400" y1="380" x2="140" y2="380" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="270" y="375" text-anchor="middle" font-size="11" fill="#92400e">9. Confirmation + Toast</text>
  <!-- Activation boxes -->
  <rect x="136" y="120" width="8" height="265" fill="#dbeafe" opacity="0.6"/>
  <rect x="396" y="120" width="8" height="265" fill="#dcfce7" opacity="0.6"/>
  <rect x="656" y="155" width="8" height="200" fill="#fef3c7" opacity="0.6"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
</body></html>
