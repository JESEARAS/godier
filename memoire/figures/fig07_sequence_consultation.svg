<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;padding:0}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, sans-serif">
  <rect width="900" height="520" fill="white"/>
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Figure 7 — Diagramme de séquence : Création d'une consultation</text>
  <rect x="80" y="50" width="120" height="35" rx="4" fill="#2563eb"/>
  <text x="140" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Médecin</text>
  <line x1="140" y1="85" x2="140" y2="500" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="340" y="50" width="120" height="35" rx="4" fill="#16a34a"/>
  <text x="400" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Interface</text>
  <line x1="400" y1="85" x2="400" y2="500" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="600" y="50" width="120" height="35" rx="4" fill="#d97706"/>
  <text x="660" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Store (Data)</text>
  <line x1="660" y1="85" x2="660" y2="500" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="140" y1="120" x2="400" y2="120" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="11" fill="#1e40af">1. Ouvrir consultation</text>
  <line x1="400" y1="155" x2="660" y2="155" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="530" y="150" text-anchor="middle" font-size="11" fill="#15803d">2. Charger dossiers patients</text>
  <line x1="660" y1="185" x2="400" y2="185" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="530" y="180" text-anchor="middle" font-size="11" fill="#92400e">3. Retourner patients</text>
  <line x1="140" y1="225" x2="400" y2="225" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="270" y="220" text-anchor="middle" font-size="11" fill="#1e40af">4. Sélectionner patient</text>
  <line x1="140" y1="260" x2="400" y2="260" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="270" y="255" text-anchor="middle" font-size="11" fill="#1e40af">5. Saisir symptômes</text>
  <line x1="140" y1="295" x2="400" y2="295" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#1e40af">6. Saisir diagnostic</text>
  <line x1="140" y1="330" x2="400" y2="330" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="270" y="325" text-anchor="middle" font-size="11" fill="#1e40af">7. Saisir traitement + ordonnance</text>
  <line x1="140" y1="365" x2="400" y2="365" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#1e40af">8. Valider</text>
  <line x1="400" y1="395" x2="660" y2="395" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="530" y="390" text-anchor="middle" font-size="11" fill="#15803d">9. add(consultation)</text>
  <line x1="660" y1="425" x2="400" y2="425" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="530" y="420" text-anchor="middle" font-size="11" fill="#92400e">10. ID généré</text>
  <line x1="400" y1="455" x2="140" y2="455" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="270" y="450" text-anchor="middle" font-size="11" fill="#92400e">11. Toast succès</text>
  <rect x="136" y="120" width="8" height="340" fill="#dbeafe" opacity="0.6"/>
  <rect x="396" y="120" width="8" height="340" fill="#dcfce7" opacity="0.6"/>
  <rect x="656" y="155" width="8" height="275" fill="#fef3c7" opacity="0.6"/>
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
</body></html>
