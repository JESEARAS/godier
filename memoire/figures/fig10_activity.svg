<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;padding:0}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650" font-family="Arial, sans-serif">
  <rect width="700" height="650" fill="white"/>
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Figure 10 — Diagramme d'activité : Consultation médicale</text>
  <!-- Start -->
  <circle cx="350" cy="55" r="18" fill="#1e293b"/>
  <text x="350" y="60" text-anchor="middle" font-size="10" fill="white">Début</text>
  <line x1="350" y1="73" x2="350" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- Action 1 -->
  <rect x="250" y="95" width="200" height="40" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="120" text-anchor="middle" font-size="12" fill="#1e40af">Ouvrir module Consultations</text>
  <line x1="350" y1="135" x2="350" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- Action 2 -->
  <rect x="250" y="155" width="200" height="40" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="180" text-anchor="middle" font-size="12" fill="#1e40af">Cliquer « Ajouter »</text>
  <line x1="350" y1="195" x2="350" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- Decision -->
  <polygon points="350,215 420,255 350,295 280,255" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="350" y="260" text-anchor="middle" font-size="11" fill="#92400e">Champs</text>
  <text x="350" y="275" text-anchor="middle" font-size="11" fill="#92400e">valides ?</text>
  <!-- No branch -->
  <line x1="420" y1="255" x2="530" y2="255" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="475" y="250" text-anchor="middle" font-size="10" fill="#dc2626">Non</text>
  <rect x="530" y="235" width="140" height="40" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="260" text-anchor="middle" font-size="11" fill="#dc2626">Afficher erreurs</text>
  <line x1="600" y1="275" x2="600" y2="300" stroke="#dc2626" stroke-width="2"/>
  <line x1="600" y1="300" x2="350" y2="300" stroke="#dc2626" stroke-width="2"/>
  <line x1="350" y1="295" x2="350" y2="155" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- Yes branch -->
  <line x1="350" y1="295" x2="350" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="365" y="315" font-size="10" fill="#16a34a">Oui</text>
  <!-- Action 3 -->
  <rect x="250" y="325" width="200" height="40" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="350" text-anchor="middle" font-size="12" fill="#1e40af">Sélectionner patient &amp; médecin</text>
  <line x1="350" y1="365" x2="350" y2="385" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- Action 4 -->
  <rect x="250" y="385" width="200" height="40" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="410" text-anchor="middle" font-size="12" fill="#1e40af">Saisir diagnostic &amp; traitement</text>
  <line x1="350" y1="425" x2="350" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- Action 5 -->
  <rect x="250" y="445" width="200" height="40" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="470" text-anchor="middle" font-size="12" fill="#1e40af">Valider l'enregistrement</text>
  <line x1="350" y1="485" x2="350" y2="505" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- Action 6 -->
  <rect x="250" y="505" width="200" height="40" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="530" text-anchor="middle" font-size="12" fill="#15803d">Notification de succès</text>
  <line x1="350" y1="545" x2="350" y2="570" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- End -->
  <circle cx="350" cy="590" r="18" fill="none" stroke="#1e293b" stroke-width="3"/>
  <circle cx="350" cy="590" r="12" fill="#1e293b"/>
  <text x="350" y="625" text-anchor="middle" font-size="10" fill="#1e293b">Fin</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
</body></html>
