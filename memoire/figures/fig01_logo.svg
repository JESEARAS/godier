<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;padding:0}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" font-family="Arial, sans-serif">
  <rect width="400" height="400" fill="white"/>
  <!-- Outer circle -->
  <circle cx="200" cy="200" r="180" fill="#2563eb" stroke="#1e40af" stroke-width="3"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="white" stroke-width="2"/>
  <!-- Medical cross -->
  <rect x="175" y="100" width="50" height="200" rx="8" fill="white"/>
  <rect x="100" y="175" width="200" height="50" rx="8" fill="white"/>
  <!-- Heart shape in center -->
  <path d="M200 280 C180 260, 150 240, 150 210 C150 190, 170 180, 200 200 C230 180, 250 190, 250 210 C250 240, 220 260, 200 280 Z" fill="#ef4444"/>
  <!-- Text -->
  <text x="200" y="330" text-anchor="middle" font-size="22" font-weight="bold" fill="white">CLINIQUE</text>
  <text x="200" y="355" text-anchor="middle" font-size="28" font-weight="bold" fill="white">GODIE</text>
  <!-- Star decorations -->
  <circle cx="200" cy="200" r="15" fill="none" stroke="#1e40af" stroke-width="2" opacity="0.3"/>
</svg>
</body></html>
