<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;padding:0}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Arial, sans-serif">
  <rect width="900" height="500" fill="white"/>
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Figure 12 — Architecture générale de l'application</text>
  <!-- Browser container -->
  <rect x="30" y="50" width="840" height="430" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">Navigateur (Client)</text>
  <!-- React layer -->
  <rect x="60" y="90" width="780" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Couche Présentation (React + TypeScript)</text>
  <rect x="80" y="125" width="160" height="45" rx="6" fill="white" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="153" text-anchor="middle" font-size="11" fill="#1e40af">Pages</text>
  <rect x="260" y="125" width="160" height="45" rx="6" fill="white" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="153" text-anchor="middle" font-size="11" fill="#1e40af">Composants</text>
  <rect x="440" y="125" width="160" height="45" rx="6" fill="white" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="153" text-anchor="middle" font-size="11" fill="#1e40af">Sidebar / Topbar</text>
  <rect x="620" y="125" width="200" height="45" rx="6" fill="white" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="153" text-anchor="middle" font-size="11" fill="#1e40af">Toast / Modal / UI</text>
  <!-- Logic layer -->
  <rect x="60" y="210" width="780" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Couche Logique Métier</text>
  <rect x="80" y="245" width="170" height="45" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
  <text x="165" y="273" text-anchor="middle" font-size="11" fill="#15803d">useCollection</text>
  <rect x="270" y="245" width="170" height="45" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
  <text x="355" y="273" text-anchor="middle" font-size="11" fill="#15803d">useRefStore</text>
  <rect x="460" y="245" width="170" height="45" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
  <text x="545" y="273" text-anchor="middle" font-size="11" fill="#15803d">resources.ts</text>
  <rect x="650" y="245" width="170" height="45" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
  <text x="735" y="273" text-anchor="middle" font-size="11" fill="#15803d">format.ts</text>
  <!-- Data layer -->
  <rect x="60" y="330" width="780" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Couche Persistance</text>
  <rect x="80" y="365" width="340" height="35" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="250" y="388" text-anchor="middle" font-size="11" fill="#92400e">localStorage (items + auto-increment)</text>
  <rect x="440" y="365" width="180" height="35" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="530" y="388" text-anchor="middle" font-size="11" fill="#92400e">Export JSON</text>
  <rect x="640" y="365" width="180" height="35" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="730" y="388" text-anchor="middle" font-size="11" fill="#92400e">Import JSON</text>
  <!-- Arrows -->
  <line x1="450" y1="190" x2="450" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="450" y1="310" x2="450" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
</body></html>
