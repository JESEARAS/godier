<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;padding:0}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Arial, sans-serif">
  <rect width="900" height="400" fill="white"/>
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Figure 4 — Diagramme de cas d'utilisation : Gestion des patients</text>
  <rect x="280" y="40" width="340" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="450" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Gestion des Patients</text>
  <!-- Actor -->
  <circle cx="120" cy="180" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <line x1="120" y1="198" x2="120" y2="250" stroke="#1e40af" stroke-width="2"/>
  <line x1="90" y1="220" x2="150" y2="220" stroke="#1e40af" stroke-width="2"/>
  <line x1="120" y1="250" x2="95" y2="285" stroke="#1e40af" stroke-width="2"/>
  <line x1="120" y1="250" x2="145" y2="285" stroke="#1e40af" stroke-width="2"/>
  <text x="120" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Réceptionniste</text>
  <!-- Use cases -->
  <ellipse cx="450" cy="100" rx="85" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="105" text-anchor="middle" font-size="11" fill="#1e40af">Enregistrer un patient</text>
  <ellipse cx="450" cy="160" rx="85" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="165" text-anchor="middle" font-size="11" fill="#1e40af">Modifier un patient</text>
  <ellipse cx="450" cy="220" rx="85" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="225" text-anchor="middle" font-size="11" fill="#1e40af">Supprimer un patient</text>
  <ellipse cx="450" cy="280" rx="85" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="285" text-anchor="middle" font-size="11" fill="#1e40af">Rechercher un patient</text>
  <ellipse cx="450" cy="340" rx="85" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="345" text-anchor="middle" font-size="11" fill="#1e40af">Exporter la liste (PDF)</text>
  <!-- Lines -->
  <line x1="138" y1="180" x2="365" y2="100" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="180" x2="365" y2="160" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="180" x2="365" y2="220" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="180" x2="365" y2="280" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="180" x2="365" y2="340" stroke="#64748b" stroke-width="1"/>
</svg>
</body></html>
