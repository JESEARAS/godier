<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;padding:0}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Arial, sans-serif">
  <rect width="900" height="500" fill="white"/>
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Figure 3 — Diagramme de cas d'utilisation général</text>
  <!-- System boundary -->
  <rect x="250" y="40" width="400" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="450" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Système de Gestion Hospitalière</text>
  <!-- Actors -->
  <circle cx="120" cy="180" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <line x1="120" y1="198" x2="120" y2="250" stroke="#1e40af" stroke-width="2"/>
  <line x1="90" y1="220" x2="150" y2="220" stroke="#1e40af" stroke-width="2"/>
  <line x1="120" y1="250" x2="95" y2="285" stroke="#1e40af" stroke-width="2"/>
  <line x1="120" y1="250" x2="145" y2="285" stroke="#1e40af" stroke-width="2"/>
  <text x="120" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Administrateur</text>
  <circle cx="780" cy="180" r="18" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <line x1="780" y1="198" x2="780" y2="250" stroke="#15803d" stroke-width="2"/>
  <line x1="750" y1="220" x2="810" y2="220" stroke="#15803d" stroke-width="2"/>
  <line x1="780" y1="250" x2="755" y2="285" stroke="#15803d" stroke-width="2"/>
  <line x1="780" y1="250" x2="805" y2="285" stroke="#15803d" stroke-width="2"/>
  <text x="780" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Médecin</text>
  <circle cx="120" cy="380" r="18" fill="#d97706" stroke="#b45309" stroke-width="2"/>
  <line x1="120" y1="398" x2="120" y2="440" stroke="#b45309" stroke-width="2"/>
  <line x1="90" y1="415" x2="150" y2="415" stroke="#b45309" stroke-width="2"/>
  <line x1="120" y1="440" x2="95" y2="470" stroke="#b45309" stroke-width="2"/>
  <line x1="120" y1="440" x2="145" y2="470" stroke="#b45309" stroke-width="2"/>
  <text x="120" y="495" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Réceptionniste</text>
  <!-- Use cases -->
  <ellipse cx="450" cy="100" rx="80" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="105" text-anchor="middle" font-size="11" fill="#1e40af">Gérer les patients</text>
  <ellipse cx="450" cy="155" rx="80" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="160" text-anchor="middle" font-size="11" fill="#1e40af">Gérer les rendez-vous</text>
  <ellipse cx="450" cy="210" rx="80" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="215" text-anchor="middle" font-size="11" fill="#1e40af">Gérer les consultations</text>
  <ellipse cx="450" cy="265" rx="80" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="270" text-anchor="middle" font-size="11" fill="#1e40af">Gérer les ordonnances</text>
  <ellipse cx="450" cy="320" rx="80" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="325" text-anchor="middle" font-size="11" fill="#1e40af">Gérer l'hospitalisation</text>
  <ellipse cx="450" cy="375" rx="80" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="380" text-anchor="middle" font-size="11" fill="#1e40af">Gérer la pharmacie</text>
  <ellipse cx="450" cy="430" rx="80" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="435" text-anchor="middle" font-size="11" fill="#1e40af">Gérer la facturation</text>
  <!-- Lines from actors to use cases -->
  <line x1="138" y1="180" x2="370" y2="100" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="180" x2="370" y2="155" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="180" x2="370" y2="210" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="180" x2="370" y2="265" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="180" x2="370" y2="320" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="180" x2="370" y2="375" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="180" x2="370" y2="430" stroke="#64748b" stroke-width="1"/>
  <line x1="762" y1="180" x2="530" y2="210" stroke="#64748b" stroke-width="1"/>
  <line x1="762" y1="180" x2="530" y2="265" stroke="#64748b" stroke-width="1"/>
  <line x1="762" y1="180" x2="530" y2="320" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="380" x2="370" y2="100" stroke="#64748b" stroke-width="1"/>
  <line x1="138" y1="380" x2="370" y2="155" stroke="#64748b" stroke-width="1"/>
</svg>
</body></html>
